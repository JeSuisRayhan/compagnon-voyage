  // following segment (lookahead), since that phrase is what lets us infer the time.
  const timeLedConnectorRe = new RegExp("\\bet\\s+(?=le matin\\b|en matin[ée]e\\b|[aà]\\s+midi\\b|le soir\\b|en soir[ée]e\\b|l" + AP + "apr[eè]s-midi\\b|vers\\s+\\d)", "gi");
  const TIME_WORDS = [{
    re: new RegExp("\\bd[ée]but d" + AP + "apr[eè]s-midi\\b", "i"),
    time: "14:00"
  }, {
    re: /\bfin d['\u2019]apr[eè]s-midi\b/i,
    time: "17:00"
  }, {
    re: new RegExp("\\bl" + AP + "apr[eè]s-midi\\b|\\bapr[eè]s-midi\\b", "i"),
    time: "14:30"
  }, {
    re: /\ble matin\b|\ben matin[ée]e\b/i,
    time: "09:00"
  }, {
    re: /\bmidi\b/i,
    time: "12:00"
  }, {
    re: /\ble soir\b|\ben soir[ée]e\b|\bce soir\b/i,
    time: "19:00"
  }, {
    re: /\bla nuit\b/i,
    time: "22:00"
  }, {
    re: /\bfin de journ[ée]e\b/i,
    time: "18:00"

  lines.forEach(line => {
    const sentences = line.split(/(?<=[.;])\s+/).filter(Boolean);
    sentences.forEach(sentence => {
      sentence.split(timeLedConnectorRe).flatMap(chunk => chunk.split(plainConnectorRe)).map(s => s.trim()).filter(Boolean).forEach(p => segments.push(p));

  segments.forEach(seg => {
    let time = null;
    const explicit = seg.match(explicitTimeRe);

    } else {
      const found = TIME_WORDS.find(tw => tw.re.test(seg));
      if (found) time = found.time;
    }
    let title = seg.replace(explicitTimeRe, "").replace(/^(on a|on est all[ée]e?s?|nous avons|nous sommes all[ée]e?s?|on part(?:s)? pour|on va(?:it)?)\s+/i, "").replace(/\s{2,}/g, " ").replace(/^[-,;:\s]+|[-,;:\s]+$/g, "").trim();

      time,
      title,
      type: guessTypeFromBody(title)

  const ordered = [...timed, ...untimed];
  const out = ["Jour 1"];
  ordered.forEach(a => {
    const tag = a.type !== "activite" ? ` [${a.type}]` : "";
    out.push(`${a.time || ""} ${a.title}${tag}`.trim());
  });
  return out.join("\n");
}

// ---------- money & time helpers ----------

function formatMoney(amount, code) {
  if (amount === null || amount === undefined || isNaN(amount)) return "";
  const n = Math.round(amount * 100) / 100;
  try {
    return new Intl.NumberFormat("fr-FR", {
      style: "currency",
      currency: code,
      maximumFractionDigits: 2
    }).format(n);
  } catch (e) {
    return `${n.toLocaleString("fr-FR")} ${code}`;
  }
}
function convertAmount(amount, rate) {
  if (amount === null || amount === undefined || isNaN(amount)) return null;
  return amount * (rate || 1);
}
function shiftTime(timeStr, offsetHours) {
  if (!timeStr || !offsetHours) return null;
  const [h, m] = timeStr.split(":").map(Number);
  let total = h * 60 + m + Math.round(offsetHours * 60);
  let dayShift = 0;
  while (total < 0) {
    total += 24 * 60;
    dayShift -= 1;
  }
  while (total >= 24 * 60) {
    total -= 24 * 60;
    dayShift += 1;
  }
  const hh = Math.floor(total / 60);
  const mm = total % 60;
  return {
    time: `${pad2(hh)}:${pad2(mm)}`,
    dayShift
  };
}
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], {
    type: mime
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyOrDownloadText(text, filename) {
  try {
    if (navigator.clipboard && window.isSecureContext !== false) {
      await navigator.clipboard.writeText(text);
      return "copied";
    }
  } catch (e) {
    // fall through to download
  }
  try {
    downloadFile(text, filename, "text/plain;charset=utf-8");
    return "downloaded";
  } catch (e) {
    return "failed";
  }
}

// Compresses an image file client-side (resize + re-encode as JPEG) before
// it's stored — a raw phone photo can be several MB, which would blow
// through localStorage's ~5-10MB quota after just a couple of documents.
function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 1280;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lecture du fichier échouée"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image invalide"));
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.round(height * maxDim / width);
            width = maxDim;
          } else {
            width = Math.round(width * maxDim / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

              fromDayId: bd.day.id,

              fromWeather: bd.weather,

  const days = trip.days.map(d => ({
    ...d,
    activities: [...d.activities]

  moves.forEach(m => {
    const fromDay = days.find(d => d.id === m.fromDayId);
    const toDay = days.find(d => d.id === m.toDayId);
    if (!fromDay || !toDay) return;
    const idx = fromDay.activities.findIndex(a => a.id === m.activityId);
    if (idx === -1) return;
    const [activity] = fromDay.activities.splice(idx, 1);
    toDay.activities.push({
      ...activity,
      time: null
    });
  });
  return {
    ...trip,
    days
  };

  entries.forEach(entry => {
    const norm = entry.activity.title.trim().toLowerCase();

        anchorDayId: entry.dayId,
        title: entry.activity.title,

        firstDayIndex: entry.dayIndex,

        firstDayTitle: entry.dayTitle,
        price: entry.activity.price

      .ticket-divider-h::after { right: -16px; }

      /* ---- page backdrop ---- */
      body {
        background: ${THEME.bg};
      }
      @media (min-width: 560px) {
        body {
          background:
            radial-gradient(ellipse 640px 480px at 12% 8%, ${THEME.coral}2e 0%, transparent 60%),
            radial-gradient(ellipse 560px 460px at 88% 18%, ${THEME.teal}26 0%, transparent 60%),
            radial-gradient(ellipse 620px 520px at 20% 92%, ${THEME.pink}22 0%, transparent 60%),
            radial-gradient(ellipse 700px 560px at 85% 95%, ${THEME.gold}20 0%, transparent 60%),
            ${THEME.bg};
          background-attachment: fixed;
        }
      }

      /* ---- app shell responsiveness ---- */
      .app-shell {
        width: 100%;
        max-width: 420px;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: none;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas: "header" "content" "tabbar";
      }
      @media (min-width: 560px) {
        .app-shell {
          max-width: 100%;
          height: 100vh;
          height: 100dvh;
          margin: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }
      @media (min-width: 900px) {
        .app-shell {
          grid-template-columns: 92px 1fr;
          grid-template-rows: auto 1fr;
          grid-template-areas: "tabbar header" "tabbar content";
        }
        .gs-content-inner {
          max-width: 1100px;
          width: 100%;
          margin: 0 auto;
          padding: 0 8px;
        }
      }

      .gs-header { grid-area: header; min-width: 0; }
      .gs-content { grid-area: content; min-width: 0; }
      .gs-tabbar { grid-area: tabbar; }

      .tabbar-hidden-on-mobile { display: none; }
      @media (min-width: 900px) {
        .tabbar-hidden-on-mobile { display: flex; }
      }

      @media (min-width: 900px) {
        .gs-tabbar {
          flex-direction: column !important;
          align-items: stretch !important;
          border-top: none !important;
          border-right: 1px solid ${THEME.border};
          padding: 18px 0 !important;
          gap: 4px;
          height: 100%;
        }
        .gs-tabbar button {
          flex: none !important;
          padding: 12px 0 !important;
        }
      }

      /* wide-screen reflow: lists become responsive grids instead of a single static column */
      .reflow-list {
        display: flex;
        flex-direction: column;
      }
      @media (min-width: 640px) {
        .reflow-list.reflow-cards {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
          align-items: start;
        }
        .reflow-list.reflow-cards > * {
          margin-bottom: 0 !important;
        }
      }
      @media (min-width: 1000px) {
        .reflow-list.reflow-cards {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* ---- keyframes ---- */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes stampIn {
        0% { opacity: 0; transform: rotate(-3deg) scale(1.6); }
        60% { opacity: 1; transform: rotate(-3deg) scale(0.92); }
        100% { opacity: 1; transform: rotate(-3deg) scale(1); }
      }
      @keyframes sheetSlideUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes overlayFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes checkPop {
        0% { transform: scale(0.7); }
        60% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes toastIn {
        from { opacity: 0; transform: translateY(16px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .screen-enter { animation: fadeSlideIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .card-enter { animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .stamp-enter { animation: stampIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sheet-overlay-anim { animation: overlayFadeIn 0.2s ease both; }
      .sheet-panel-anim { animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .toast-anim { animation: toastIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .checked-pop { animation: checkPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .spin-slow { animation: spin 2.4s linear infinite; }

      .accordion-collapse {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .accordion-collapse.is-open {
        grid-template-rows: 1fr;
      }
      .accordion-collapse > div {
        overflow: hidden;
      }

      .press-feedback {
        transition: transform 0.12s ease, opacity 0.12s ease;
      }
      .press-feedback:active {
        transform: scale(0.97);
        opacity: 0.9;
      }

      .tab-btn {
        transition: color 0.15s ease, background 0.15s ease;
      }

      @media (min-width: 560px) {
        .day-grid-cols { grid-template-columns: repeat(6, 1fr) !important; }
      }
    `);
}
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(TripCompanion));

  } catch (err) {
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    box.textContent = "Erreur au chargement de l'app :\n\n" + (err && err.stack ? err.stack : err);
    console.error(err);
  }
})();
</script>
</body>
</html>
